<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#060E1D"/>
      <stop offset="100%" stop-color="#030710"/>
    </linearGradient>

    <!-- Radial Glow Behind Emblem -->
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00E5A3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Globe Ring Gradient -->
    <linearGradient id="globeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Orbit Path Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FE"/>
      <stop offset="40%" stop-color="#00D8FF"/>
      <stop offset="100%" stop-color="#E0FFFF"/>
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE853"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="65" x2="860" y2="65"/>
    <line x1="0" y1="130" x2="860" y2="130"/>
    <line x1="0" y1="195" x2="860" y2="195"/>
    <line x1="140" y1="0" x2="140" y2="260"/>
    <line x1="270" y1="0" x2="270" y2="260"/>
    <line x1="565" y1="0" x2="565" y2="260"/>
  </g>

  <!-- ============================================================== -->
  <!-- LEFT: THE EMBLEM (Centered at X: 140, Y: 130)                 -->
  <!-- ============================================================== -->
  <g transform="translate(140, 130)">
    <!-- Radial Aura -->
    <circle cx="0" cy="0" r="110" fill="url(#emblemGlow)"/>

    <!-- Subtle Crosshairs -->
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#0C2548" stroke-width="1"/>
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#0C2548" stroke-width="1"/>

    <!-- Outer Coordinate / Dial Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#133156" stroke-width="1" stroke-dasharray="2.5, 6"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Cardinal Coordinate Ticks -->
    <line x1="0" y1="-88" x2="0" y2="-95" stroke="#00F0FF" stroke-width="2.5"/>
    <line x1="0" y1="88" x2="0" y2="95" stroke="#00F0FF" stroke-width="2.5"/>
    <line x1="-88" y1="0" x2="-95" y2="0" stroke="#00F0FF" stroke-width="2.5"/>
    <line x1="88" y1="0" x2="95" y2="0" stroke="#00F0FF" stroke-width="2.5"/>

    <!-- Ordinal Corner Ticks -->
    <line x1="62" y1="62" x2="67" y2="67" stroke="#00E5A3" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="-62" y1="62" x2="-67" y2="67" stroke="#00E5A3" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="62" y1="-62" x2="67" y2="-67" stroke="#00E5A3" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="-62" y1="-62" x2="-67" y2="-67" stroke="#00E5A3" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Main Globe Ring -->
    <circle cx="0" cy="0" r="72" fill="#040D1B" stroke="url(#globeRingGrad)" stroke-width="3" filter="url(#neonGlow)"/>

    <!-- DGGS Hexagonal Grid Cells -->
    <g stroke="#00E5FF" stroke-opacity="0.22" stroke-width="1.2" fill="none">
      <polygon points="0,-58 14,-50 14,-34 0,-26 -14,-34 -14,-50"/>
      <polygon points="0,-22 17,-12 17,9 0,19 -17,9 -17,-12" fill="#00E5FF" fill-opacity="0.04"/>
      <polygon points="-36,-24 -21,-15 -21,4 -36,13 -51,4 -51,-15"/>
      <polygon points="36,-24 51,-15 51,4 36,13 21,4 21,-15"/>
      <polygon points="0,24 14,32 14,48 0,56 -14,48 -14,32"/>
    </g>

    <!-- Curved Latitude Lines -->
    <g stroke="#1E548A" stroke-opacity="0.5" stroke-width="1.2" fill="none">
      <ellipse cx="0" cy="0" rx="72" ry="22"/>
      <ellipse cx="0" cy="-28" rx="63" ry="15"/>
      <ellipse cx="0" cy="28" rx="63" ry="15"/>
    </g>

    <!-- Meridian Line -->
    <line x1="0" y1="-72" x2="0" y2="72" stroke="#1E548A" stroke-opacity="0.4" stroke-width="1.2"/>

    <!-- Topographic / Bathymetric Contour Strata -->
    <g fill="none" stroke-linecap="round">
      <path d="M -60 14 Q -30 2, 0 16 T 60 8" stroke="#00F0FF" stroke-width="2.6" filter="url(#neonGlow)"/>
      <path d="M -54 30 Q -22 16, 8 32 T 55 26" stroke="#00E5A3" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M -42 46 Q -15 36, 16 48 T 42 44" stroke="#059669" stroke-width="2" stroke-opacity="0.75"/>
    </g>

    <!-- Constellation / GeoAI Neural Nodes & Edges -->
    <g stroke="#00F0FF" stroke-opacity="0.65" stroke-width="1.4">
      <line x1="-24" y1="-30" x2="18" y2="-5"/>
      <line x1="-38" y1="-2" x2="-24" y2="-30"/>
      <line x1="-38" y1="-2" x2="-10" y2="18"/>
      <line x1="-10" y1="18" x2="18" y2="-5"/>
      <line x1="-10" y1="18" x2="32" y2="34"/>
      <line x1="0" y1="52" x2="32" y2="34"/>
    </g>

    <!-- Glowing Graph Vertices -->
    <circle cx="-24" cy="-30" r="3.5" fill="#00F0FF" filter="url(#neonGlow)"/>
    <circle cx="18" cy="-5" r="4.2" fill="#00E5A3" filter="url(#neonGlow)"/>
    <circle cx="-38" cy="-2" r="2.8" fill="#38BDF8"/>
    <circle cx="-10" cy="18" r="4.5" fill="#00F0FF" filter="url(#neonGlow)"/>
    <circle cx="32" cy="34" r="3.2" fill="#00E5A3"/>
    <circle cx="0" cy="52" r="2.6" fill="#38BDF8"/>

    <!-- Tilted Elliptical Orbit Path -->
    <ellipse cx="0" cy="0" rx="104" ry="38" transform="rotate(-32)" fill="none" stroke="url(#orbitGrad)" stroke-width="2.6" stroke-dasharray="130 14 38 14 60 14" filter="url(#neonGlow)"/>

    <!-- Satellite Node with Square Halo -->
    <g transform="rotate(-32)">
      <!-- Outer diamond/square halo -->
      <rect x="94" y="-8" width="16" height="16" transform="rotate(45, 102, 0)" fill="#00F0FF" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.8"/>
      <!-- Core glowing dot -->
      <circle cx="102" cy="0" r="5" fill="#FFFFFF" filter="url(#neonGlow)"/>
      <circle cx="102" cy="0" r="2.4" fill="#00F0FF"/>
    </g>

    <!-- Golden Apex Star (North Pole Beacon) -->
    <g transform="translate(0, -72)">
      <path d="M 0 -13 L 2.8 -3.5 L 12 0 L 2.8 3.5 L 0 13 L -2.8 3.5 L -12 0 L -2.8 -3.5 Z" fill="url(#starGrad)" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT: THE TYPOGRAPHY LOCKUP                                   -->
  <!-- ============================================================== -->
  <g transform="translate(280, 0)">
    <!-- Line 1: NEXT GENERATION -->
    <text x="0" y="88"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="15"
          font-weight="800"
          fill="#00F0FF"
          letter-spacing="5px">NEXT GENERATION</text>

    <!-- Line 2: OPEN GEOSPATIAL -->
    <text x="0" y="142"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="44"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="0.5px">OPEN GEOSPATIAL</text>

    <!-- Line 3: SOLUTIONS ACADEMY -->
    <text x="0" y="194"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="33"
          font-weight="800"
          fill="#00E5A3"
          letter-spacing="1.2px">SOLUTIONS ACADEMY</text>
  </g>
</svg>
