<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="100%" height="100%">
  <!-- Background -->
  <rect width="820" height="360" fill="#f8fafc" rx="10" />

  <!-- ================= LEFT PANEL: DIFFUSION ================= -->
  <g transform="translate(40, 20)">
    <!-- Title -->
    <text x="160" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
      1. Diffusion Process (No Jumps)
    </text>
    <text x="160" y="45" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Continuous sample paths (Brownian / GBM)
    </text>

    <!-- Axes -->
    <line x1="40" y1="260" x2="320" y2="260" stroke="#334155" stroke-width="2" />
    <line x1="40" y1="260" x2="40" y2="70" stroke="#334155" stroke-width="2" />
    <!-- Arrows -->
    <polygon points="320,256 328,260 320,264" fill="#334155" />
    <polygon points="36,70 40,62 44,70" fill="#334155" />

    <text x="325" y="280" font-family="sans-serif" font-size="12" fill="#334155">Time (t)</text>
    <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#334155">X(t)</text>

    <!-- Continuous Diffusion Path (No Jumps) -->
    <path d="M 40,180 
             Q 55,160 65,175 
             T 90,140 
             T 115,155 
             T 140,110 
             T 165,130 
             T 190,95 
             T 215,120 
             T 240,85 
             T 265,105 
             T 290,75 
             T 315,90" 
          fill="none" stroke="#2563eb" stroke-width="2.5" />

    <!-- Label / Note -->
    <text x="175" y="295" font-family="sans-serif" font-size="11" fill="#1e40af" font-weight="600" text-anchor="middle">
      ✓ Everywhere continuous (no tears or gaps)
    </text>
  </g>

  <!-- Divider -->
  <line x1="410" y1="30" x2="410" y2="330" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ================= RIGHT PANEL: PURE JUMP ================= -->
  <g transform="translate(450, 20)">
    <!-- Title -->
    <text x="160" y="25" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0f172a" text-anchor="middle">
      2. Jump Process (No Diffusion)
    </text>
    <text x="160" y="45" font-family="sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Piecewise constant (Compound Poisson)
    </text>

    <!-- Axes -->
    <line x1="40" y1="260" x2="320" y2="260" stroke="#334155" stroke-width="2" />
    <line x1="40" y1="260" x2="40" y2="70" stroke="#334155" stroke-width="2" />
    <!-- Arrows -->
    <polygon points="320,256 328,260 320,264" fill="#334155" />
    <polygon points="36,70 40,62 44,70" fill="#334155" />

    <text x="325" y="280" font-family="sans-serif" font-size="12" fill="#334155">Time (t)</text>
    <text x="25" y="58" font-family="sans-serif" font-size="12" fill="#334155">X(t)</text>

    <!-- Segment 1 -->
    <line x1="40" y1="200" x2="105" y2="200" stroke="#dc2626" stroke-width="2.5" />
    <!-- Jump 1: Upward -->
    <line x1="105" y1="200" x2="105" y2="135" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="105" cy="135" r="3.5" fill="#dc2626" />

    <!-- Segment 2 -->
    <line x1="105" y1="135" x2="185" y2="135" stroke="#dc2626" stroke-width="2.5" />
    <!-- Jump 2: Downward -->
    <line x1="185" y1="135" x2="185" y2="170" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="185" cy="170" r="3.5" fill="#dc2626" />

    <!-- Segment 3 -->
    <line x1="185" y1="170" x2="250" y2="170" stroke="#dc2626" stroke-width="2.5" />
    <!-- Jump 3: Upward -->
    <line x1="250" y1="170" x2="250" y2="90" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="250" cy="90" r="3.5" fill="#dc2626" />

    <!-- Segment 4 -->
    <line x1="250" y1="90" x2="315" y2="90" stroke="#dc2626" stroke-width="2.5" />

    <!-- Label / Note -->
    <text x="175" y="295" font-family="sans-serif" font-size="11" fill="#b91c1c" font-weight="600" text-anchor="middle">
      ✓ Flat between arrivals; sharp vertical steps
    </text>
  </g>
</svg>
