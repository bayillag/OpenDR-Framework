<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <!-- Background Card -->
  <rect width="840" height="380" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- ==================== LEFT PANEL: DIFFUSION PROCESS ==================== -->
  <g transform="translate(40, 20)">
    <!-- Header Titles -->
    <text x="170" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
      1. Diffusion Process (No Jumps)
    </text>
    <text x="170" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Continuous sample paths (e.g., Brownian motion, GBM)
    </text>

    <!-- Axes -->
    <!-- X-Axis -->
    <line x1="45" y1="260" x2="330" y2="260" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <polygon points="330,256 338,260 330,264" fill="#334155" />
    <!-- Y-Axis -->
    <line x1="45" y1="260" x2="45" y2="70" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <polygon points="41,70 45,62 49,70" fill="#334155" />

    <!-- Axis Labels -->
    <text x="335" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">Time (t)</text>
    <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="end">X(t)</text>

    <!-- Continuous Diffusion Trajectory (Bounded safely between y=110 and y=200) -->
    <path d="M 45,195 
             L 58,188 L 68,196 L 80,180 L 92,168 L 105,176 L 118,155 L 130,162 
             L 142,142 L 155,150 L 168,132 L 180,145 L 192,122 L 205,135 L 218,118 
             L 230,138 L 242,125 L 255,148 L 268,135 L 280,120 L 292,130 L 305,112 
             L 318,124 L 328,115" 
          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Feature Description -->
    <rect x="35" y="295" width="270" height="30" rx="6" fill="#eff6ff" />
    <text x="170" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">
      ✓ Everywhere continuous (no tears, gaps, or jumps)
    </text>
  </g>

  <!-- Vertical Divider -->
  <line x1="420" y1="25" x2="420" y2="355" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5" />

  <!-- ==================== RIGHT PANEL: PURE JUMP PROCESS ==================== -->
  <g transform="translate(460, 20)">
    <!-- Header Titles -->
    <text x="170" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">
      2. Jump Process (No Diffusion)
    </text>
    <text x="170" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">
      Piecewise constant paths (e.g., Compound Poisson)
    </text>

    <!-- Axes -->
    <!-- X-Axis -->
    <line x1="45" y1="260" x2="330" y2="260" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <polygon points="330,256 338,260 330,264" fill="#334155" />
    <!-- Y-Axis -->
    <line x1="45" y1="260" x2="45" y2="70" stroke="#334155" stroke-width="2" stroke-linecap="round" />
    <polygon points="41,70 45,62 49,70" fill="#334155" />

    <!-- Axis Labels -->
    <text x="335" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">Time (t)</text>
    <text x="32" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="end">X(t)</text>

    <!-- Segment 1: Base level -->
    <line x1="45" y1="210" x2="115" y2="210" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <!-- Jump 1: Upward jump -->
    <line x1="115" y1="210" x2="115" y2="150" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3" />
    <circle cx="115" cy="150" r="4" fill="#dc2626" />

    <!-- Segment 2: Intermediate level -->
    <line x1="115" y1="150" x2="195" y2="150" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <!-- Jump 2: Downward jump -->
    <line x1="195" y1="150" x2="195" y2="180" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3" />
    <circle cx="195" cy="180" r="4" fill="#dc2626" />

    <!-- Segment 3: Lower-middle level -->
    <line x1="195" y1="180" x2="260" y2="180" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <!-- Jump 3: Large Upward jump -->
    <line x1="260" y1="180" x2="260" y2="105" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3" />
    <circle cx="260" cy="105" r="4" fill="#dc2626" />

    <!-- Segment 4: Top level -->
    <line x1="260" y1="105" x2="325" y2="105" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />

    <!-- Feature Description -->
    <rect x="35" y="295" width="270" height="30" rx="6" fill="#fef2f2" />
    <text x="170" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">
      ✓ Flat between arrivals; sharp vertical step jumps
    </text>
  </g>
</svg>
