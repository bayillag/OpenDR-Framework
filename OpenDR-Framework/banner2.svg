<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152">
  <defs>
    <!-- Embedded Modern Sans-Serif Font -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Inter:wght@800;900&amp;display=swap');
      
      .font-sub {
        font-family: 'Montserrat', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 28px;
        font-weight: 900;
        fill: #00E5FF;
        letter-spacing: 11px;
      }
      
      .font-main {
        font-family: 'Montserrat', 'Inter', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 84px;
        font-weight: 900;
        fill: #FFFFFF;
        letter-spacing: 1px;
      }
      
      .font-academy {
        font-family: 'Montserrat', 'Inter', 'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 67px;
        font-weight: 900;
        fill: #00E5A3;
        letter-spacing: 2px;
      }
    </style>

    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020612"/>
      <stop offset="45%" stop-color="#050E20"/>
      <stop offset="75%" stop-color="#07142A"/>
      <stop offset="100%" stop-color="#02050D"/>
    </linearGradient>

    <!-- Radial Nebula Glow Behind Emblem -->
    <radialGradient id="emblemGlow" cx="26%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#00E5A3" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Globe Ring Gradient -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Orbit Path Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FE"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5A3"/>
    </linearGradient>

    <!-- Star Beacon Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. FULL CANVAS BACKGROUND (2048 x 1152)                        -->
  <!-- ============================================================== -->
  <rect width="2048" height="1152" fill="url(#bgGrad)"/>
  <rect width="2048" height="1152" fill="url(#emblemGlow)"/>

  <!-- High-Tech Blueprint Matrix Grid Lines -->
  <g opacity="0.05" stroke="#38BDF8" stroke-width="1.5">
    <line x1="0" y1="192" x2="2048" y2="192"/>
    <line x1="0" y1="384" x2="2048" y2="384"/>
    <line x1="0" y1="576" x2="2048" y2="576"/>
    <line x1="0" y1="768" x2="2048" y2="768"/>
    <line x1="0" y1="960" x2="2048" y2="960"/>
    <line x1="256" y1="0" x2="256" y2="1152"/>
    <line x1="512" y1="0" x2="512" y2="1152"/>
    <line x1="768" y1="0" x2="768" y2="1152"/>
    <line x1="1024" y1="0" x2="1024" y2="1152"/>
    <line x1="1280" y1="0" x2="1280" y2="1152"/>
    <line x1="1536" y1="0" x2="1536" y2="1152"/>
    <line x1="1792" y1="0" x2="1792" y2="1152"/>
  </g>

  <!-- Ambient Topography Waves in Lower Background -->
  <g fill="none" opacity="0.1" stroke-linecap="round">
    <path d="M -50 980 Q 400 860, 950 1000 T 2150 940" stroke="#00E5FF" stroke-width="3"/>
    <path d="M -50 1030 Q 500 920, 1100 1040 T 2150 990" stroke="#00E5A3" stroke-width="2.5"/>
  </g>

  <!-- ============================================================== -->
  <!-- 2. CENTERED SAFE-AREA LOCKUP (Centered at Y: 576)              -->
  <!-- ============================================================== -->
  <g transform="translate(320, 576)">

    <!-- EMBLEM (Center at X: 160, Y: 0) -->
    <g transform="translate(160, 0)">
      <!-- Crosshairs -->
      <line x1="0" y1="-180" x2="0" y2="180" stroke="#0C2548" stroke-width="1.5"/>
      <line x1="-180" y1="0" x2="180" y2="0" stroke="#0C2548" stroke-width="1.5"/>

      <!-- Outer Coordinate / Dial Ring -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#133156" stroke-width="1.5" stroke-dasharray="4, 9"/>
      <circle cx="0" cy="0" r="148" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3"/>

      <!-- Cardinal Coordinate Ticks -->
      <line x1="0" y1="-148" x2="0" y2="-160" stroke="#00E5FF" stroke-width="4"/>
      <line x1="0" y1="148" x2="0" y2="160" stroke="#00E5FF" stroke-width="4"/>
      <line x1="-148" y1="0" x2="-160" y2="0" stroke="#00E5FF" stroke-width="4"/>
      <line x1="148" y1="0" x2="160" y2="0" stroke="#00E5FF" stroke-width="4"/>

      <!-- Ordinal Corner Ticks -->
      <line x1="104" y1="104" x2="112" y2="112" stroke="#00E5A3" stroke-width="2.5" stroke-opacity="0.65"/>
      <line x1="-104" y1="104" x2="-112" y2="112" stroke="#00E5A3" stroke-width="2.5" stroke-opacity="0.65"/>
      <line x1="104" y1="-104" x2="112" y2="-112" stroke="#00E5A3" stroke-width="2.5" stroke-opacity="0.65"/>
      <line x1="-104" y1="-104" x2="-112" y2="-112" stroke="#00E5A3" stroke-width="2.5" stroke-opacity="0.65"/>

      <!-- Main Globe Ring -->
      <circle cx="0" cy="0" r="120" fill="#040D1B" stroke="url(#globeGrad)" stroke-width="4.5" filter="url(#neonGlow)"/>

      <!-- DGGS Hexagonal Grid Cells -->
      <g stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.8" fill="none">
        <polygon points="0,-96 23,-83 23,-57 0,-43 -23,-57 -23,-83"/>
        <polygon points="0,-36 28,-20 28,15 0,31 -28,15 -28,-20" fill="#00E5FF" fill-opacity="0.04"/>
        <polygon points="-60,-40 -35,-25 -35,7 -60,22 -85,7 -85,-25"/>
        <polygon points="60,-40 85,-25 85,7 60,22 35,7 35,-25"/>
        <polygon points="0,40 23,53 23,80 0,93 -23,80 -23,53"/>
      </g>

      <!-- Curved Latitude Lines -->
      <g stroke="#1E548A" stroke-opacity="0.55" stroke-width="1.8" fill="none">
        <ellipse cx="0" cy="0" rx="120" ry="36"/>
        <ellipse cx="0" cy="-46" rx="105" ry="25"/>
        <ellipse cx="0" cy="46" rx="105" ry="25"/>
      </g>

      <!-- Meridian Line -->
      <line x1="0" y1="-120" x2="0" y2="120" stroke="#1E548A" stroke-opacity="0.45" stroke-width="1.8"/>

      <!-- Topographic & Bathymetric Contour Strata -->
      <g fill="none" stroke-linecap="round">
        <path d="M -100 23 Q -50 3, 0 27 T 100 13" stroke="#00E5FF" stroke-width="4.2" filter="url(#neonGlow)"/>
        <path d="M -90 50 Q -36 27, 14 53 T 92 43" stroke="#00E5A3" stroke-width="3.8" stroke-opacity="0.95"/>
        <path d="M -70 77 Q -25 60, 27 80 T 70 73" stroke="#059669" stroke-width="3.2" stroke-opacity="0.8"/>
      </g>

      <!-- Constellation / GeoAI Neural Nodes & Edges -->
      <g stroke="#00E5FF" stroke-opacity="0.75" stroke-width="2.2">
        <line x1="-40" y1="-50" x2="30" y2="-8"/>
        <line x1="-63" y1="-3" x2="-40" y2="-50"/>
        <line x1="-63" y1="-3" x2="-17" y2="30"/>
        <line x1="-17" y1="30" x2="30" y2="-8"/>
        <line x1="-17" y1="30" x2="53" y2="57"/>
        <line x1="0" y1="86" x2="53" y2="57"/>
      </g>

      <!-- Glowing Graph Vertices -->
      <circle cx="-40" cy="-50" r="5.5" fill="#00E5FF" filter="url(#neonGlow)"/>
      <circle cx="30" cy="-8" r="6.8" fill="#00E5A3" filter="url(#neonGlow)"/>
      <circle cx="-63" cy="-3" r="4.6" fill="#38BDF8"/>
      <circle cx="-17" cy="30" r="7.2" fill="#00E5FF" filter="url(#neonGlow)"/>
      <circle cx="53" cy="57" r="5.2" fill="#00E5A3"/>
      <circle cx="0" cy="86" r="4.2" fill="#38BDF8"/>

      <!-- Tilted Elliptical Orbit Path -->
      <ellipse cx="0" cy="0" rx="174" ry="63" transform="rotate(-32)" fill="none" stroke="url(#orbitGrad)" stroke-width="4.2" stroke-dasharray="215 22 63 22 98 22" filter="url(#neonGlow)"/>

      <!-- Satellite Node with Square Halo -->
      <g transform="rotate(-32)">
        <rect x="156" y="-14" width="28" height="28" transform="rotate(45, 170, 0)" fill="#00E5FF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.4"/>
        <circle cx="170" cy="0" r="8.5" fill="#FFFFFF" filter="url(#neonGlow)"/>
        <circle cx="170" cy="0" r="4" fill="#00E5FF"/>
      </g>

      <!-- Golden Apex Star (North Pole Beacon) -->
      <g transform="translate(0, -120)">
        <path d="M 0 -22 L 4.8 -6 L 20 0 L 4.8 6 L 0 22 L -4.8 6 L -20 0 L -4.8 -6 Z" fill="url(#starGrad)" filter="url(#neonGlow)"/>
        <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- TYPOGRAPHY LOCKUP (Starts at X: 400) -->
    <g transform="translate(400, 0)">
      <!-- Line 1: NEXT GENERATION -->
      <text x="0" y="-76" class="font-sub">NEXT GENERATION</text>

      <!-- Line 2: OPEN GEOSPATIAL -->
      <text x="0" y="14" class="font-main">OPEN GEOSPATIAL</text>

      <!-- Line 3: SOLUTIONS ACADEMY -->
      <text x="0" y="94" class="font-academy">SOLUTIONS ACADEMY</text>
    </g>

  </g>
</svg>
