<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="100%" height="100%" style="font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Card Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Connector Arrow Head -->
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M 1.5 1 L 6.5 4 L 1.5 7 Z" fill="#64748b" />
    </marker>

    <!-- Custom GRACE Groundwater Icon -->
    <g id="icon-grace-groundwater">
      <path d="M12 1 C12 1 11 2.5 11 3.5 A1 1 0 0 0 13 3.5 C13 2.5 12 1 12 1 Z" fill="#0ea5e9"/>
      <path d="M9.5 4.2 C9.5 4.2 8.5 5.7 8.5 6.7 A1 1 0 0 0 10.5 6.7 C10.5 5.7 9.5 4.2 9.5 4.2 Z" fill="#0ea5e9"/>
      <path d="M14.5 4.2 C14.5 4.2 13.5 5.7 13.5 6.7 A1 1 0 0 0 15.5 6.7 C15.5 5.7 14.5 4.2 14.5 4.2 Z" fill="#0ea5e9"/>
      <path d="M7 7.4 C7 7.4 6 8.9 6 9.9 A1 1 0 0 0 8 9.9 C8 8.9 7 7.4 7 7.4 Z" fill="#0ea5e9"/>
      <path d="M12 7.4 C12 7.4 11 8.9 11 9.9 A1 1 0 0 0 13 9.9 C13 8.9 12 7.4 12 7.4 Z" fill="#0ea5e9"/>
      <path d="M17 7.4 C17 7.4 16 8.9 16 9.9 A1 1 0 0 0 18 9.9 C18 8.9 17 7.4 17 7.4 Z" fill="#0ea5e9"/>
      <path d="M 4 13 C 4 16 7 22 12 22 C 17 22 20 16 20 13 C 17.5 14.5 16.5 11.5 14.5 13 C 12.5 14.5 11.5 11.5 9.5 13 C 7.5 14.5 6.5 11.5 4 13 Z" fill="#0054a6"/>
      <path d="M 3.3 17 C 5.5 19 8.5 15 12 17.5 C 15.5 20 18.5 16 20.7 17" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Satellite Icon -->
    <g id="icon-satellite" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <rect x="10" y="5" width="4" height="12" rx="1" fill="#475569"/>
      <rect x="2" y="9" width="7" height="4" rx="1" fill="#3b82f6"/>
      <rect x="15" y="9" width="7" height="4" rx="1" fill="#3b82f6"/>
      <line x1="9" y1="11" x2="15" y2="11" stroke="#475569" stroke-width="1.5"/>
      <circle cx="12" cy="18" r="1.5" fill="#64748b"/>
    </g>

    <!-- OpenDR Inundation (Submerged House) Icon -->
    <g id="icon-flood-assessment" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
      <g transform="translate(8,14) rotate(-18) translate(-8,-14)">
        <path d="M 11.5 8.5 L 11.5 6.2 A 0.4 0.4 0 0 1 12.5 6.2 L 12.5 9.5" stroke-width="1" />
        <path d="M 3 11 L 8.5 6 L 14 11" stroke-width="1.2" />
        <rect x="4.2" y="11" width="8.6" height="8.5" rx="0.5" />
        <rect x="7.5" y="12.5" width="2" height="2" rx="0.2" stroke-width="1" />
        <rect x="7.5" y="15.2" width="2" height="4" rx="0.4" stroke-width="1" />
      </g>
      <path d="M15.5 8.5 a2.1 2.1 0 0 1 3.5 -1.5 a2.8 2.8 0 0 1 4.5 1 a2.1 2.1 0 0 1 -0.5 4 h-7.5 a2.1 2.1 0 0 1 0 -3.5 z" stroke="#0ea5e9" stroke-width="1.2"/>
      <path d="M16 11.5 C16 11.5 15 12.5 15 13.2 A 1 1 0 0 0 17 13.2 C17 12.5 16 11.5 16 11.5 Z" stroke="#0ea5e9" stroke-width="1" />
      <path d="M18.5 11.5 C18.5 11.5 17.5 12.5 17.5 13.2 A 1 1 0 0 0 19.5 13.2 C19.5 12.5 18.5 11.5 18.5 11.5 Z" stroke="#0ea5e9" stroke-width="1" />
      <path d="M21 11.5 C21 11.5 20 12.5 20 13.2 A 1 1 0 0 0 22 13.2 C22 12.5 21 11.5 21 11.5 Z" stroke="#0ea5e9" stroke-width="1" />
      <path d="M 1,18 Q 3.75,16 6.5,18 T 12,18 T 17.5,18 T 23,18" stroke="#0054a6" stroke-width="1" />
      <path d="M 1,20.5 Q 3.75,18.5 6.5,20.5 T 12,20.5 T 17.5,20.5 T 23,20.5" stroke="#0054a6" stroke-width="1" />
      <path d="M 1,23 L 23,23" stroke="#0054a6" stroke-width="1" />
    </g>

    <!-- Open Buildings (Polygons) Icon -->
    <g id="icon-open-buildings" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
      <polygon points="4,5 11,3 13,8 6,10" />
      <polygon points="14,4 20,4 20,11 17,11 17,7 14,7" />
      <polygon points="4,13 10,11 12,17 6,19" />
      <polygon points="13,14 19,12 21,17 15,19" />
    </g>

    <!-- Hazard Vulnerability Icon -->
    <g id="icon-hazard-map" fill="none" stroke="#be123c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 16 L10 12 L16 16 L20 12 M4 20 L10 16 L16 20 L20 16" />
      <polygon points="12,3 15,9 9,9" fill="#ffe4e6" stroke-width="1.2" />
      <line x1="12" y1="5" x2="12" y2="7" stroke-width="1" />
    </g>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="800" height="590" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Connector Lines -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <!-- GRACE -> Inundation Engine -->
    <path d="M 400 110 L 400 182" marker-end="url(#arrow)" />
    <!-- ALOS-2 -> Inundation Engine -->
    <path d="M 260 230 L 282 230" marker-end="url(#arrow)" />
    <!-- Sentinel Archives -> Inundation Engine -->
    <path d="M 540 230 L 518 230" marker-end="url(#arrow)" />
    <!-- Inundation Engine -> Google Open Buildings -->
    <path d="M 400 270 L 400 332" marker-end="url(#arrow)" />
    <!-- Google Open Buildings -> Displacement Risk Map -->
    <path d="M 400 420 L 400 472" marker-end="url(#arrow)" />
  </g>

  <!-- Architecture Nodes Group -->
  <g filter="url(#shadow)">
    <!-- 1. GRACE LWE ANOMALY NODE (Top Center) -->
    <rect x="260" y="40" width="280" height="70" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="1.5" rx="8" />
    <use href="#icon-grace-groundwater" x="275" y="63" width="24" height="24" />
    <text x="315" y="70" font-size="14" font-weight="bold" fill="#0369a1">GRACE LWE Anomaly</text>
    <text x="315" y="88" font-size="11" fill="#0284c7">Liquid Water Equivalent Anomaly</text>

    <!-- 2. JAXA ALOS-2 L-BAND SAR NODE (Middle Left) -->
    <rect x="45" y="190" width="215" height="80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <use href="#icon-satellite" x="60" y="218" width="24" height="24" />
    <text x="95" y="222" font-size="13" font-weight="bold" fill="#1e293b">JAXA ALOS-2 SAR</text>
    <text x="95" y="240" font-size="11" fill="#475569">L-band Synthetic Aperture Radar</text>

    <!-- 3. OPENDR INUNDATION ENGINE NODE (Middle Center) -->
    <rect x="290" y="190" width="220" height="80" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="8" />
    <use href="#icon-flood-assessment" x="305" y="218" width="24" height="24" />
    <text x="340" y="222" font-size="13" font-weight="bold" fill="#1e3a8a">OpenDR Inundation</text>
    <text x="340" y="240" font-size="11" fill="#1d4ed8">Flood &amp; Surface Water Mapping</text>

    <!-- 4. SENTINEL-1/2 ARCHIVES NODE (Middle Right) -->
    <rect x="540" y="190" width="215" height="80" fill="#f0fdfa" stroke="#ccfbf1" stroke-width="1.5" rx="8" />
    <use href="#icon-satellite" x="555" y="218" width="24" height="24" />
    <text x="590" y="222" font-size="13" font-weight="bold" fill="#0f2f2e">Sentinel-1/2 Archives</text>
    <text x="590" y="240" font-size="11" fill="#0d9488">Multi-spectral &amp; SAR Imagery</text>

    <!-- 5. GOOGLE OPEN BUILDINGS NODE (Sub-Center) -->
    <rect x="260" y="340" width="280" height="80" fill="#e8f0fe" stroke="#bfdbfe" stroke-width="1.5" rx="8" />
    <use href="#icon-open-buildings" x="275" y="368" width="24" height="24" />
    <text x="315" y="372" font-size="14" font-weight="bold" fill="#172554">Google Open Buildings</text>
    <text x="315" y="390" font-size="11" fill="#1a73e8">AI-Derived Structural Footprints</text>

    <!-- 6. DISPLACEMENT RISK MAP NODE (Bottom Center) -->
    <rect x="260" y="480" width="280" height="80" fill="#fff1f2" stroke="#ffe4e6" stroke-width="1.5" rx="8" />
    <use href="#icon-hazard-map" x="275" y="508" width="24" height="24" />
    <text x="315" y="512" font-size="14" font-weight="bold" fill="#4c0519">Displacement Risk Map</text>
    <text x="315" y="530" font-size="11" fill="#be123c">Inundation &amp; Population Exposure</text>
  </g>
</svg>
