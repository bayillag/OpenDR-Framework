<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" width="2048" height="1152">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020611"/>
      <stop offset="35%" stop-color="#061024"/>
      <stop offset="70%" stop-color="#08142C"/>
      <stop offset="100%" stop-color="#02050D"/>
    </linearGradient>

    <!-- Radial Nebula & Emblem Glow -->
    <radialGradient id="nebulaCenter" cx="30%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#00E5A3" stop-opacity="0.07"/>
      <stop offset="80%" stop-color="#0284C7" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaRight" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Globe Ring Gradient -->
    <linearGradient id="globeRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="55%" stop-color="#00E5A3"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Orbit Path Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#00F0FF"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00E5A3"/>
    </linearGradient>

    <!-- Golden Apex Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowHeavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="3" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. FULL CANVAS CINEMATIC BACKGROUND (2048 x 1152)              -->
  <!-- ============================================================== -->
  <rect width="2048" height="1152" fill="url(#bannerBg)"/>
  <rect width="2048" height="1152" fill="url(#nebulaCenter)"/>
  <rect width="2048" height="1152" fill="url(#nebulaRight)"/>

  <!-- High-Tech Coordinate Grid & Blueprint Matrix -->
  <g opacity="0.04" stroke="#38BDF8" stroke-width="1.2">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="144" x2="2048" y2="144"/>
    <line x1="0" y1="288" x2="2048" y2="288"/>
    <line x1="0" y1="432" x2="2048" y2="432"/>
    <line x1="0" y1="576" x2="2048" y2="576"/>
    <line x1="0" y1="720" x2="2048" y2="720"/>
    <line x1="0" y1="864" x2="2048" y2="864"/>
    <line x1="0" y1="1008" x2="2048" y2="1008"/>

    <!-- Vertical Grid Lines -->
    <line x1="256" y1="0" x2="256" y2="1152"/>
    <line x1="512" y1="0" x2="512" y2="1152"/>
    <line x1="768" y1="0" x2="768" y2="1152"/>
    <line x1="1024" y1="0" x2="1024" y2="1152"/>
    <line x1="1280" y1="0" x2="1280" y2="1152"/>
    <line x1="1536" y1="0" x2="1536" y2="1152"/>
    <line x1="1792" y1="0" x2="1792" y2="1152"/>
  </g>

  <!-- Ambient Planetary Telemetry & Technical Notation (TV/Desktop Periphery) -->
  <g font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="12" fill="#00E5FF" opacity="0.35" letter-spacing="3px">
    <!-- Top Bar Telemetry -->
    <text x="80" y="80">SYS // EPSG:4326 [WGS 84] — GEODETIC NETWORK</text>
    <text x="1440" y="80">ORBITAL OBSERVABILITY // STAC 1.0 • COG • CLOUD-NATIVE</text>

    <!-- Bottom Bar Telemetry -->
    <text x="80" y="1080">TIER-1 OPEN GEOMATICS // POSTGIS 3D • TGRASS • GDAL/PROJ</text>
    <text x="1560" y="1080">GEOAI FOUNDATION // MULTI-MODAL EARTH INTEL</text>
  </g>

  <!-- Corner Alignment Crosshairs -->
  <g stroke="#00F0FF" stroke-width="1.5" opacity="0.4">
    <!-- Top-Left -->
    <line x1="70" y1="80" x2="90" y2="80"/>
    <line x1="80" y1="70" x2="80" y2="90"/>
    <!-- Top-Right -->
    <line x1="1958" y1="80" x2="1978" y2="80"/>
    <line x1="1968" y1="70" x2="1968" y2="90"/>
    <!-- Bottom-Left -->
    <line x1="70" y1="1072" x2="90" y2="1072"/>
    <line x1="80" y1="1062" x2="80" y2="1082"/>
    <!-- Bottom-Right -->
    <line x1="1958" y1="1072" x2="1978" y2="1072"/>
    <line x1="1968" y1="1062" x2="1968" y2="1082"/>
  </g>

  <!-- Wide Sweeping Ambient Topography Strata (Bottom Expanse) -->
  <g fill="none" opacity="0.12" stroke-linecap="round">
    <path d="M -50 960 Q 400 840, 950 980 T 2150 920" stroke="#00F0FF" stroke-width="3"/>
    <path d="M -50 1010 Q 500 900, 1100 1020 T 2150 970" stroke="#00E5A3" stroke-width="2.5"/>
    <path d="M -50 1060 Q 600 960, 1250 1070 T 2150 1020" stroke="#10B981" stroke-width="2"/>
  </g>

  <!-- ============================================================== -->
  <!-- 2. CENTRAL SAFE AREA LOCKUP (Centered at Y: 576)               -->
  <!-- Total Width: ~1180px, Fits cleanly inside mobile/desktop       -->
  <!-- ============================================================== -->

  <!-- Left: The Emblem (Center: 580, 576) -->
  <g transform="translate(580, 576)">
    <!-- Radial Aura -->
    <circle cx="0" cy="0" r="170" fill="url(#nebulaCenter)"/>

    <!-- Axis Crosshairs -->
    <line x1="0" y1="-155" x2="0" y2="155" stroke="#0C2548" stroke-width="1.5"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke="#0C2548" stroke-width="1.5"/>

    <!-- Outer Coordinate & Dial Rings -->
    <circle cx="0" cy="0" r="142" fill="none" stroke="#133156" stroke-width="1.5" stroke-dasharray="3.5, 8"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Cardinal Coordinate Ticks -->
    <line x1="0" y1="-130" x2="0" y2="-142" stroke="#00F0FF" stroke-width="3.5"/>
    <line x1="0" y1="130" x2="0" y2="142" stroke="#00F0FF" stroke-width="3.5"/>
    <line x1="-130" y1="0" x2="-142" y2="0" stroke="#00F0FF" stroke-width="3.5"/>
    <line x1="130" y1="0" x2="142" y2="0" stroke="#00F0FF" stroke-width="3.5"/>

    <!-- Ordinal Corner Ticks -->
    <line x1="92" y1="92" x2="100" y2="100" stroke="#00E5A3" stroke-width="2.2" stroke-opacity="0.6"/>
    <line x1="-92" y1="92" x2="-100" y2="100" stroke="#00E5A3" stroke-width="2.2" stroke-opacity="0.6"/>
    <line x1="92" y1="-92" x2="100" y2="-100" stroke="#00E5A3" stroke-width="2.2" stroke-opacity="0.6"/>
    <line x1="-92" y1="-92" x2="-100" y2="-100" stroke="#00E5A3" stroke-width="2.2" stroke-opacity="0.6"/>

    <!-- Main Planetary Globe Ring -->
    <circle cx="0" cy="0" r="106" fill="#040D1B" stroke="url(#globeRingGrad)" stroke-width="4.2" filter="url(#glowHeavy)"/>

    <!-- Hexagonal DGGS Lattice -->
    <g stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1.6" fill="none">
      <polygon points="0,-85 20,-73 20,-50 0,-38 -20,-50 -20,-73"/>
      <polygon points="0,-32 25,-17 25,13 0,28 -25,13 -25,-17" fill="#00E5FF" fill-opacity="0.04"/>
      <polygon points="-53,-35 -31,-22 -31,6 -53,19 -75,6 -75,-22"/>
      <polygon points="53,-35 75,-22 75,6 53,19 31,6 31,-22"/>
      <polygon points="0,35 20,47 20,71 0,83 -20,71 -20,47"/>
    </g>

    <!-- Curvilinear Latitude Parallels -->
    <g stroke="#1E548A" stroke-opacity="0.55" stroke-width="1.8" fill="none">
      <ellipse cx="0" cy="0" rx="106" ry="32"/>
      <ellipse cx="0" cy="-41" rx="93" ry="22"/>
      <ellipse cx="0" cy="41" rx="93" ry="22"/>
    </g>

    <!-- Meridian Line -->
    <line x1="0" y1="-106" x2="0" y2="106" stroke="#1E548A" stroke-opacity="0.5" stroke-width="1.8"/>

    <!-- Topographic & Bathymetric Contour Strata -->
    <g fill="none" stroke-linecap="round">
      <path d="M -88 20 Q -44 3, 0 24 T 88 12" stroke="#00F0FF" stroke-width="3.8" filter="url(#glowHeavy)"/>
      <path d="M -80 44 Q -32 24, 12 47 T 81 38" stroke="#00E5A3" stroke-width="3.4" stroke-opacity="0.9"/>
      <path d="M -62 68 Q -22 53, 24 71 T 62 65" stroke="#059669" stroke-width="2.8" stroke-opacity="0.8"/>
    </g>

    <!-- Constellation / GeoAI Neural Nodes & Edges -->
    <g stroke="#00F0FF" stroke-opacity="0.75" stroke-width="2">
      <line x1="-35" y1="-44" x2="26" y2="-7"/>
      <line x1="-56" y1="-3" x2="-35" y2="-44"/>
      <line x1="-56" y1="-3" x2="-15" y2="26"/>
      <line x1="-15" y1="26" x2="26" y2="-7"/>
      <line x1="-15" y1="26" x2="47" y2="50"/>
      <line x1="0" y1="76" x2="47" y2="50"/>
    </g>

    <!-- Glowing Graph Vertices -->
    <circle cx="-35" cy="-44" r="5" fill="#00F0FF" filter="url(#glowHeavy)"/>
    <circle cx="26" cy="-7" r="6" fill="#00E5A3" filter="url(#glowHeavy)"/>
    <circle cx="-56" cy="-3" r="4.2" fill="#38BDF8"/>
    <circle cx="-15" cy="26" r="6.5" fill="#00F0FF" filter="url(#glowHeavy)"/>
    <circle cx="47" cy="50" r="4.8" fill="#00E5A3"/>
    <circle cx="0" cy="76" r="3.8" fill="#38BDF8"/>

    <!-- Tilted Elliptical Orbit Path -->
    <ellipse cx="0" cy="0" rx="154" ry="56" transform="rotate(-32)" fill="none" stroke="url(#orbitGrad)" stroke-width="3.8" stroke-dasharray="190 20 56 20 88 20" filter="url(#glowHeavy)"/>

    <!-- Satellite Node with Square Halo -->
    <g transform="rotate(-32)">
      <rect x="139" y="-12" width="24" height="24" transform="rotate(45, 151, 0)" fill="#00F0FF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1.2"/>
      <circle cx="151" cy="0" r="7.5" fill="#FFFFFF" filter="url(#glowHeavy)"/>
      <circle cx="151" cy="0" r="3.5" fill="#00F0FF"/>
    </g>

    <!-- Golden Apex Star (North Pole Beacon) -->
    <g transform="translate(0, -106)">
      <path d="M 0 -19 L 4.2 -5 L 18 0 L 4.2 5 L 0 19 L -4.2 5 L -18 0 L -4.2 -5 Z" fill="url(#starGrad)" filter="url(#glowHeavy)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Right: The Typography Lockup (Starts at X: 780, Vertically Balanced at Y: 576) -->
  <g transform="translate(780, 0)">
    <!-- Line 1: NEXT GENERATION -->
    <text x="0" y="504"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="22"
          font-weight="800"
          fill="#00F0FF"
          letter-spacing="7.5px">NEXT GENERATION</text>

    <!-- Line 2: OPEN GEOSPATIAL -->
    <text x="0" y="582"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="64"
          font-weight="900"
          fill="#FFFFFF"
          letter-spacing="0.8px">OPEN GEOSPATIAL</text>

    <!-- Line 3: SOLUTIONS ACADEMY -->
    <text x="0" y="654"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="48"
          font-weight="800"
          fill="#00E5A3"
          letter-spacing="1.8px">SOLUTIONS ACADEMY</text>
  </g>
</svg>
