<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Table Header Lines -->
  <line x1="40" y1="50" x2="760" y2="50" stroke="#333" stroke-width="2" />
  <line x1="40" y1="90" x2="760" y2="90" stroke="#333" stroke-width="1.5" />
  
  <!-- Header Text -->
  <text x="40" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Scenario Tree Node</text>
  <text x="260" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Mitigation Measure</text>
  <text x="500" y="75" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#333">Primary Mechanism</text>

  <!-- Row 1: P2 -->
  <g>
    <text x="40" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a5276">P2: Cohort Infection</text>
    <text x="260" y="130" font-family="Arial, sans-serif" font-size="14" fill="#333">Pre-Export Vaccination</text>
    <text x="500" y="130" font-family="Arial, sans-serif" font-size="14" fill="#555">
      <tspan x="500" dy="0">Reduces susceptibility, viral</tspan>
      <tspan x="500" dy="20">shedding, and transmission rates.</tspan>
    </text>
  </g>

  <!-- Row 2: P3 -->
  <g>
    <text x="40" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a5276">P3: Source Failure</text>
    <text x="260" y="210" font-family="Arial, sans-serif" font-size="14" fill="#333">
      <tspan x="260" dy="0">Compulsory PCR &amp;</tspan>
      <tspan x="260" dy="20">NSP-ELISA Screening</tspan>
    </text>
    <text x="500" y="210" font-family="Arial, sans-serif" font-size="14" fill="#555">
      <tspan x="500" dy="0">Detects active shedding and</tspan>
      <tspan x="500" dy="20">subclinical carriers.</tspan>
    </text>
  </g>

  <!-- Row 3: P6 -->
  <g>
    <text x="40" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a5276">P6: Contact &amp; Establishment</text>
    <text x="260" y="295" font-family="Arial, sans-serif" font-size="14" fill="#333">
      <tspan x="260" dy="0">Strict 21-Day Post-Arrival</tspan>
      <tspan x="260" dy="20">Quarantine</tspan>
    </text>
    <text x="500" y="295" font-family="Arial, sans-serif" font-size="14" fill="#555">
      <tspan x="500" dy="0">Ensures physical isolation during</tspan>
      <tspan x="500" dy="20">the incubation period.</tspan>
    </text>
  </g>

  <!-- Footer Line -->
  <line x1="40" y1="360" x2="760" y2="360" stroke="#333" stroke-width="2" />
</svg>
