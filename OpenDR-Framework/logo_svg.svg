<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bg-glow" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#08213d" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#041224" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#02060f" stop-opacity="1"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="wave-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="sphere-fill" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a2a4a" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#031326" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#010914" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00ffcc"/>
      <stop offset="70%" stop-color="#00b4d8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-star" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background Tech Grid Pattern -->
    <pattern id="tech-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>

    <!-- Emblem Boundary Clip -->
    <clipPath id="emblem-clip">
      <circle cx="260" cy="365" r="132"/>
    </clipPath>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="#020712"/>
  <rect width="1280" height="720" fill="url(#bg-glow)"/>
  <rect width="1280" height="720" fill="url(#tech-grid)"/>

  <!-- Ambient Flowing Background Lines -->
  <g opacity="0.22" fill="none" stroke-linecap="round">
    <path d="M -50 260 C 300 240, 600 320, 1330 220" stroke="#0077b6" stroke-width="1.2"/>
    <path d="M -50 290 C 250 270, 750 350, 1330 250" stroke="#00b4d8" stroke-width="1"/>
    <path d="M -50 540 C 350 490, 800 640, 1330 520" stroke="#004b87" stroke-width="1.5"/>
    <path d="M -50 570 C 450 510, 700 660, 1330 560" stroke="#0096c7" stroke-width="1"/>
    <path d="M -50 600 C 400 560, 850 670, 1330 610" stroke="#00f5d4" stroke-width="0.8"/>
  </g>

  <!-- ==================== EMBLEM ==================== -->
  <g id="logo-emblem">

    <!-- Reticle Ticks & Guide Lines -->
    <g stroke="#00b4d8" stroke-opacity="0.6" stroke-width="1.5">
      <!-- Axis crosshairs (outside circle) -->
      <line x1="260" y1="205" x2="260" y2="223"/>
      <line x1="260" y1="507" x2="260" y2="525"/>
      <line x1="100" y1="365" x2="118" y2="365"/>
      <line x1="402" y1="365" x2="420" y2="365"/>

      <!-- Cardinal tick marks (diagonal) -->
      <line x1="147" y1="252" x2="157" y2="262" stroke-opacity="0.3"/>
      <line x1="373" y1="252" x2="363" y2="262" stroke-opacity="0.3"/>
      <line x1="147" y1="478" x2="157" y2="468" stroke-opacity="0.3"/>
      <line x1="373" y1="478" x2="363" y2="468" stroke-opacity="0.3"/>
    </g>

    <!-- Outer Fine Reticle Circle -->
    <circle cx="260" cy="365" r="150" fill="none" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 9"/>

    <!-- Main Outer Tech Ring -->
    <circle cx="260" cy="365" r="132" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-opacity="0.9" filter="url(#glow-cyan)"/>
    <circle cx="260" cy="365" r="132" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Orb Core with Clipped Inner Graphic -->
    <g clip-path="url(#emblem-clip)">
      <!-- Sphere Deep Background -->
      <circle cx="260" cy="365" r="132" fill="url(#sphere-fill)"/>

      <!-- Geospatial Grid / Arcs (Latitude & Longitude) -->
      <g fill="none" stroke="#00a8e8" stroke-opacity="0.18" stroke-width="1">
        <ellipse cx="260" cy="365" rx="125" ry="42"/>
        <ellipse cx="260" cy="335" rx="115" ry="32"/>
        <ellipse cx="260" cy="395" rx="115" ry="32"/>
        <path d="M 260 230 C 210 270, 210 460, 260 500"/>
        <path d="M 260 230 C 310 270, 310 460, 260 500"/>
        <line x1="128" y1="365" x2="392" y2="365"/>
      </g>

      <!-- Constellation / 3D Spatial Wireframe Nodes -->
      <g fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.45">
        <!-- Connecting facets -->
        <polygon points="195,310 250,280 295,305 235,335" fill="#00e5ff" fill-opacity="0.04"/>
        <polygon points="250,280 325,275 355,315 295,305" fill="#00e5ff" fill-opacity="0.06"/>
        <polygon points="235,335 295,305 315,355 240,370" fill="#00e5ff" fill-opacity="0.05"/>
        <polygon points="295,305 355,315 370,360 315,355" fill="#00f5d4" fill-opacity="0.08"/>

        <!-- Structural wireframe lines -->
        <line x1="195" y1="310" x2="235" y2="335"/>
        <line x1="235" y1="335" x2="240" y2="370"/>
        <line x1="315" y1="355" x2="370" y2="360"/>
        <line x1="325" y1="275" x2="295" y2="250"/>
        <line x1="250" y1="280" x2="295" y2="250"/>
        <line x1="195" y1="310" x2="175" y2="340"/>
        <line x1="175" y1="340" x2="235" y2="335"/>
      </g>

      <!-- Constellation Minor Dots -->
      <g fill="#7dd3fc">
        <circle cx="195" cy="310" r="2.5"/>
        <circle cx="250" cy="280" r="2.5"/>
        <circle cx="325" cy="275" r="2.5"/>
        <circle cx="295" cy="305" r="3"/>
        <circle cx="355" cy="315" r="3"/>
        <circle cx="235" cy="335" r="3"/>
        <circle cx="240" cy="370" r="2.5"/>
        <circle cx="370" cy="360" r="2.5"/>
      </g>

      <!-- Primary Geospatial Beacon Node (Pulsing Center-Right) -->
      <circle cx="315" cy="355" r="14" fill="url(#node-glow)"/>
      <circle cx="315" cy="355" r="4.5" fill="#ffffff" filter="url(#glow-cyan)"/>
      <circle cx="315" cy="355" r="2" fill="#00ffa2"/>

      <!-- Contour / Topographic Waves (Bottom Half) -->
      <!-- Layer 4: Deep teal base wave -->
      <path d="M 125 450 C 165 425, 205 455, 255 435 C 305 415, 345 440, 395 430 L 395 500 L 125 500 Z" fill="#022c22" fill-opacity="0.3"/>
      <path d="M 125 450 C 165 425, 205 455, 255 435 C 305 415, 345 440, 395 430" fill="none" stroke="url(#wave-grad-3)" stroke-width="2.5"/>

      <!-- Layer 3: Mid emerald wave -->
      <path d="M 125 425 C 175 400, 215 440, 270 415 C 320 395, 360 425, 395 410" fill="none" stroke="url(#wave-grad-2)" stroke-width="3"/>

      <!-- Layer 2: Main bright cyan-green crest wave -->
      <path d="M 125 400 C 170 375, 210 410, 260 390 C 310 370, 350 405, 395 385" fill="none" stroke="url(#wave-grad-1)" stroke-width="3.8" filter="url(#glow-cyan)"/>

      <!-- Layer 1: Foreground fast ripple -->
      <path d="M 130 465 C 180 440, 230 470, 290 445 C 340 425, 370 450, 395 445" fill="none" stroke="#10b981" stroke-width="2"/>

      <!-- Floating Data Coordinates on Waves -->
      <circle cx="180" cy="392" r="2.5" fill="#ffffff"/>
      <circle cx="285" cy="410" r="3" fill="#00ffcc" filter="url(#glow-cyan)"/>
      <circle cx="340" cy="385" r="2.5" fill="#38bdf8"/>
      <circle cx="230" cy="455" r="2" fill="#34d399"/>
    </g>

    <!-- Outer Orbit Swapped Loop (Passes in front & swings wide left) -->
    <path d="M 390 280 C 420 320, 420 390, 360 440 C 300 490, 200 520, 140 470 C 80 420, 85 340, 150 280 C 190 240, 245 228, 305 240" 
          fill="none" 
          stroke="url(#orbit-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round"
          filter="url(#glow-heavy)"/>

    <path d="M 390 280 C 420 320, 420 390, 360 440 C 300 490, 200 520, 140 470 C 80 420, 85 340, 150 280 C 190 240, 245 228, 305 240" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="1.2" 
          stroke-opacity="0.85"
          stroke-linecap="round"/>

    <!-- Orbital Satellite at Upper-Right Apex -->
    <g transform="translate(396, 275) rotate(32)">
      <!-- Outer Sensor Bracket / Diamond Body -->
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="#041a30" stroke="#00e5ff" stroke-width="2" filter="url(#glow-cyan)"/>
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.8"/>
      
      <!-- Sensor Lens Core -->
      <circle cx="0" cy="0" r="5" fill="#00f5d4"/>
      <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
      
      <!-- Solar Array Pins / Antennas -->
      <line x1="-15" y1="0" x2="-11" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <line x1="11" y1="0" x2="15" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <line x1="0" y1="-15" x2="0" y2="-11" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Compass North Star (At top cardinal point of reticle) -->
    <g transform="translate(260, 233)">
      <!-- Star Radiant Glow -->
      <circle cx="0" cy="0" r="22" fill="url(#star-glow)"/>
      
      <!-- Optical Flares (Horizontal & Vertical Spikes) -->
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#fef08a" stroke-width="1" stroke-opacity="0.8"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#fef08a" stroke-width="1" stroke-opacity="0.8"/>
      
      <!-- Four-pointed Diamond Star -->
      <path d="M 0 -15 Q 0 0 -15 0 Q 0 0 0 15 Q 0 0 15 0 Q 0 0 0 -15 Z" 
            fill="#ffffff" 
            filter="url(#glow-star)"/>
      <path d="M 0 -11 Q 0 0 -11 0 Q 0 0 0 11 Q 0 0 11 0 Q 0 0 0 -11 Z" 
            fill="#fef08a"/>
    </g>

  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g id="logo-text" font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
    
    <!-- Subtitle: NEXT GENERATION -->
    <text x="465" y="295" 
          fill="#00aaff" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="6.5px"
          filter="url(#glow-cyan)"
          opacity="0.95">NEXT GENERATION</text>
    <text x="465" y="295" 
          fill="#38bdf8" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="6.5px">NEXT GENERATION</text>

    <!-- Title Line 1: OPEN GEOSPATIAL -->
    <text x="462" y="378" 
          fill="#ffffff" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="0.5px">OPEN GEOSPATIAL</text>

    <!-- Title Line 2: SOLUTIONS ACADEMY -->
    <text x="462" y="446" 
          fill="#00df8f" 
          font-size="59" 
          font-weight="900" 
          letter-spacing="0.5px"
          filter="url(#glow-cyan)">SOLUTIONS ACADEMY</text>
    <text x="462" y="446" 
          fill="#00f59b" 
          font-size="59" 
          font-weight="900" 
          letter-spacing="0.5px">SOLUTIONS ACADEMY</text>

  </g>
</svg>
