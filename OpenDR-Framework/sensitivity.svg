<svg width="700" height="350" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Title -->
  <text x="350" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Sensitivity Analysis: Impact on Combined Monthly Risk (P_Total)</text>
  
  <!-- Table Headers -->
  <line x1="50" y1="60" x2="650" y2="60" stroke="#333" stroke-width="1.5" />
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555">Parameter</text>
  <text x="650" y="80" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#555">Regression Coeff.</text>
  <line x1="50" y1="90" x2="650" y2="90" stroke="#333" stroke-width="1.5" />

  <!-- Bar Scale: 1.0 unit = 400 pixels -->
  
  <!-- Row 1: P2 -->
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="13" fill="#333">P2: Domestic Prevalence (Source)</text>
  <rect x="330" y="110" width="256" height="22" fill="#1a5276" />
  <text x="595" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">0.64</text>

  <!-- Row 2: P6 -->
  <text x="50" y="165" font-family="Arial, sans-serif" font-size="13" fill="#333">P6: Contact &amp; Establishment Probability</text>
  <rect x="330" y="150" width="156" height="22" fill="#2980b9" />
  <text x="495" y="166" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">0.39</text>

  <!-- Row 3: P3 -->
  <text x="50" y="205" font-family="Arial, sans-serif" font-size="13" fill="#333">P3: Source Detection Failure Rate</text>
  <rect x="330" y="190" width="100" height="22" fill="#5499c7" />
  <text x="440" y="206" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">0.25</text>

  <!-- Row 4: P5 -->
  <text x="50" y="245" font-family="Arial, sans-serif" font-size="13" fill="#333">P5: Destination Detection Failure Rate</text>
  <rect x="330" y="230" width="72" height="22" fill="#a9cce3" />
  <text x="412" y="246" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">0.18</text>

  <!-- Row 5: P4 -->
  <text x="50" y="285" font-family="Arial, sans-serif" font-size="13" fill="#333">P4: Transit Survival Rate</text>
  <rect x="330" y="270" width="12" height="22" fill="#d4e6f1" />
  <text x="350" y="286" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">0.03</text>

  <!-- Footer Line -->
  <line x1="50" y1="310" x2="650" y2="310" stroke="#333" stroke-width="1.5" />
</svg>
