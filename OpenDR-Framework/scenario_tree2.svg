<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680">
  <!-- Background -->
  <rect width="800" height="680" fill="#ffffff" />
  
  <!-- Definitions for Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Title and Goal -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Scenario Tree: Exposure Assessment</text>
  <text x="400" y="55" font-family="Arial, sans-serif" font-size="14" font-style="italic" text-anchor="middle" fill="#7f8c8d">Goal: Determine the likelihood that an entered animal establishes contact with local herds.</text>

  <!-- Node 0: Start -->
  <rect x="150" y="80" width="250" height="50" rx="5" fill="#ebf5fb" stroke="#2980b9" stroke-width="2" />
  <text x="275" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980b9">STARTING POINT</text>
  <text x="275" y="120" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">Infected Animal Reaches border</text>

  <!-- Connector Node 0 to P4 -->
  <line x1="275" y1="130" x2="275" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Node 1: P4 -->
  <rect x="150" y="180" width="250" height="65" rx="2" fill="#fff" stroke="#333" stroke-width="2" />
  <text x="275" y="205" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">P4: Survival in Transit?</text>
  <text x="275" y="228" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">Does the host survive travel?</text>

  <!-- P4 Branches -->
  <!-- No Branch -->
  <line x1="400" y1="212.5" x2="550" y2="212.5" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="430" y="203" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">No</text>
  <rect x="560" y="192.5" width="190" height="40" rx="5" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="1" />
  <text x="655" y="217" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f8c8d">[NO RISK: HOST DIED]</text>

  <!-- Yes Branch -->
  <line x1="275" y1="245" x2="275" y2="300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Yes</text>
  <text x="285" y="285" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Air: 99.9% | Sea: 98.5%</text>

  <!-- Node 2: P5 -->
  <rect x="150" y="310" width="250" height="65" rx="2" fill="#fff" stroke="#333" stroke-width="2" />
  <text x="275" y="335" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">P5: Dest. Det. Failure</text>
  <text x="275" y="358" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">Does border control miss infection?</text>

  <!-- P5 Branches -->
  <!-- No Branch -->
  <line x1="400" y1="342.5" x2="550" y2="342.5" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="430" y="333" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">No</text>
  <rect x="560" y="322.5" width="190" height="40" rx="5" fill="#fdebd0" stroke="#d35400" stroke-width="1" />
  <text x="655" y="347" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#d35400">[RISK STOPPED AT BORDER]</text>

  <!-- Yes Branch -->
  <line x1="275" y1="375" x2="275" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="398" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Yes</text>
  <text x="285" y="415" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Air: 10.0% | Sea: 15.0%</text>

  <!-- Node 3: P6 -->
  <rect x="150" y="440" width="250" height="65" rx="2" fill="#fff" stroke="#333" stroke-width="2" />
  <text x="275" y="465" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">P6: Contact Established?</text>
  <text x="275" y="488" font-family="Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">Is contact made with local herds?</text>

  <!-- P6 Branches -->
  <!-- No Branch -->
  <line x1="400" y1="472.5" x2="550" y2="472.5" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="430" y="463" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c0392b">No</text>
  <rect x="560" y="452.5" width="190" height="40" rx="5" fill="#f2f3f4" stroke="#7f8c8d" stroke-width="1" />
  <text x="655" y="477" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#7f8c8d">[NO ESTABLISHMENT]</text>

  <!-- Yes Branch -->
  <line x1="275" y1="505" x2="275" y2="560" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="285" y="528" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Yes</text>
  <text x="285" y="545" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50" font-weight="bold">Air: 40.0% | Sea: 65.0%</text>

  <!-- Final Outcome -->
  <rect x="75" y="570" width="400" height="60" rx="10" fill="#fadbd8" stroke="#c0392b" stroke-width="3" />
  <text x="275" y="595" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">EXPOSURE OF ETHIOPIAN LIVESTOCK</text>
  <text x="275" y="615" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">TO ASIA-1 PATHOGEN</text>

  <!-- Pathway Probability Summary Box -->
  <rect x="500" y="535" width="250" height="95" rx="5" fill="#fcfcfc" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4" />
  <text x="515" y="555" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Joint Exposure Probability</text>
  <line x1="515" y1="562" x2="735" y2="562" stroke="#bdc3c7" stroke-width="1" />
  <text x="515" y="582" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Air Pathway: <tspan font-weight="bold">4.00%</tspan></text>
  <text x="515" y="597" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">(99.9% × 10.0% × 40.0%)</text>
  <text x="515" y="614" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Sea Pathway: <tspan font-weight="bold">9.60%</tspan></text>
  <text x="515" y="629" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">(98.5% × 15.0% × 65.0%)</text>
</svg>
