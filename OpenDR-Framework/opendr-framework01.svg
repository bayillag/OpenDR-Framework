<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.08" flood-color="#000000"/>
    </filter>

    <!-- Marker for Upward Dashed Arrows -->
    <marker id="arrow-head" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0 0.5 L6 3 L0 5.5 Z" fill="#3b82f6"/>
    </marker>

    <!-- Vector Icons Definitions -->
    <g id="icon-fire">
      <path d="M12 2C12 2 16.5 6.5 16.5 11.5C16.5 14.5 14.5 17 12 17C9.5 17 7.5 14.5 7.5 11.5C7.5 8.5 10 5.5 10 5.5C10 5.5 11.5 7.5 11.5 9C11.5 7.5 12 2 12 2Z" fill="#ef4444"/>
    </g>
    <g id="icon-satellite">
      <rect x="10" y="5" width="4" height="12" rx="1" fill="#475569"/>
      <rect x="2" y="9" width="7" height="4" rx="1" fill="#3b82f6"/>
      <rect x="15" y="9" width="7" height="4" rx="1" fill="#3b82f6"/>
      <line x1="9" y1="11" x2="15" y2="11" stroke="#475569" stroke-width="1.5"/>
      <circle cx="12" cy="18" r="1.5" fill="#64748b"/>
    </g>
    <g id="icon-globe">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#0284c7" stroke-width="1.8"/>
      <path d="M3 12h18M12 3v18M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9M12 3C9.5 5.5 8.5 9 8.5 12s1 6.5 3.5 9" fill="none" stroke="#0284c7" stroke-width="1.2"/>
    </g>
    <g id="icon-db">
      <ellipse cx="12" cy="6" rx="6" ry="2.5" fill="#e0f2fe" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M6 6v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5V6" fill="none" stroke="#0f766e" stroke-width="1.5"/>
      <path d="M6 11v5c0 1.4 2.7 2.5 6 2.5s6-1.1 6-2.5v-5" fill="none" stroke="#0f766e" stroke-width="1.5"/>
    </g>
    <g id="icon-cloud">
      <path d="M6 14.5A3.5 3.5 0 0 1 9.5 11h.05a5 5 0 0 1 9.7-1.5h.25a3.5 3.5 0 0 1 0 7H6a3.5 3.5 0 0 1 0-7Z" fill="#0284c7"/>
    </g>
    <g id="icon-building">
      <path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M6 7h2v2H6V7zm0 4h2v2H6v-2zm0 4h2v2H6v-2zm6-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2zm6-8h2v2h-2V7zm0 4h2v2h-2v-2zm0 4h2v2h-2v-2z" fill="none" stroke="#475569" stroke-width="1.5"/>
    </g>
    <g id="icon-api">
      <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#0369a1" stroke-width="1.8"/>
      <path d="M8 12h8M12 8v8" fill="none" stroke="#0369a1" stroke-width="1.8"/>
    </g>
    <g id="icon-code">
      <path d="m8 8-4 4 4 4M16 8l4 4-4 4M13 5l-2 14" fill="none" stroke="#0f766e" stroke-width="1.8"/>
    </g>
    <g id="icon-map">
      <path d="m3 6 6-3 6 3 6-3v12l-6 3-6-3-6 3V6zm6-3v12zm6 3v12" fill="none" stroke="#b45309" stroke-width="1.8"/>
    </g>
    <g id="icon-dashboard">
      <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="#0f766e" stroke-width="1.8"/>
      <path d="M12 17v-5M8 17v-3M16 17v-8" stroke="#0f766e" stroke-width="1.8"/>
    </g>
    <g id="icon-alert">
      <path d="M12 3L2 21h20L12 3z" stroke="#be123c" stroke-width="1.8" fill="#ffe4e6"/>
      <circle cx="12" cy="17" r="1.2" fill="#be123c"/>
      <rect x="11.2" y="9" width="1.6" height="5" rx="0.5" fill="#be123c"/>
    </g>
    <g id="icon-disease">
      <circle cx="12" cy="12" r="4" fill="#65a30d"/>
      <path d="M8 8l-3-3M16 16l3 3M16 8l3-3M8 16l-3 3M6 12H2M22 12h-4" stroke="#65a30d" stroke-width="1.5"/>
    </g>
    <g id="icon-chat">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10z" fill="none" stroke="#2563eb" stroke-width="1.8"/>
    </g>
    <g id="icon-arrows">
      <path d="M4 12h16M16 8l4 4-4 4" fill="none" stroke="#0f766e" stroke-width="1.8"/>
    </g>

    <!-- Orchestration Icons -->
    <g id="icon-docker">
      <rect x="6" y="6" width="3" height="3" fill="#0db7ed"/>
      <rect x="10" y="6" width="3" height="3" fill="#0db7ed"/>
      <rect x="14" y="6" width="3" height="3" fill="#0db7ed"/>
      <rect x="8" y="10" width="3" height="3" fill="#0db7ed"/>
      <rect x="12" y="10" width="3" height="3" fill="#0db7ed"/>
      <path d="M2 15c4 0 5-3 10-3s8 3 10 0" stroke="#0db7ed" stroke-width="1.5" fill="none"/>
    </g>
    <g id="icon-k8s">
      <polygon points="12,2 20,6 20,14 12,18 4,14 4,6" fill="none" stroke="#326ce5" stroke-width="1.8"/>
      <line x1="12" y1="2" x2="12" y2="18" stroke="#326ce5" stroke-width="1.5"/>
      <line x1="4" y1="6" x2="20" y2="14" stroke="#326ce5" stroke-width="1.5"/>
      <line x1="4" y1="14" x2="20" y2="6" stroke="#326ce5" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Title Block -->
  <text x="600" y="45" font-size="28" font-weight="bold" fill="#1e3a8a" text-anchor="middle">OpenDR 1.0: Real-Time GeoAI Framework</text>
  <line x1="50" y1="65" x2="1150" y2="65" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Architecture Columns Group -->
  <g filter="url(#shadow)">
    <!-- 1. DATA INGESTION -->
    <rect x="50" y="85" width="240" height="370" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <path d="M50 93 a8 8 0 0 1 8 -8 h224 a8 8 0 0 1 8 8 v32 h-240 z" fill="#1e40af"/>
    <text x="170" y="110" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Data Ingestion</text>

    <!-- Data Ingestion List Items (Adjusted vertical spacing to 27px to clean fit 11 items) -->
    <use href="#icon-fire" x="65" y="135" width="18" height="18"/>
    <text x="92" y="149" font-size="13" font-weight="600" fill="#334155">FIRMS Hotspots</text>

    <use href="#icon-satellite" x="65" y="162" width="18" height="18"/>
    <text x="92" y="176" font-size="13" font-weight="600" fill="#334155">Sentinel-1 SAR</text>

    <use href="#icon-satellite" x="65" y="189" width="18" height="18"/>
    <text x="92" y="203" font-size="13" font-weight="600" fill="#334155">ALOS-2 PALSAR-2</text>

    <use href="#icon-satellite" x="65" y="216" width="18" height="18"/>
    <text x="92" y="230" font-size="13" font-weight="600" fill="#334155">Sentinel-2 MSI</text>

    <use href="#icon-satellite" x="65" y="243" width="18" height="18"/>
    <text x="92" y="257" font-size="13" font-weight="600" fill="#334155">Landsat 8/9</text>

    <use href="#icon-satellite" x="65" y="270" width="18" height="18"/>
    <text x="92" y="284" font-size="13" font-weight="600" fill="#334155">GOES-16/17</text>

    <use href="#icon-water" x="65" y="297" width="18" height="18"/>
    <text x="92" y="311" font-size="13" font-weight="600" fill="#334155">GRACE Groundwater</text>

    <use href="#icon-cloud" x="65" y="324" width="18" height="18"/>
    <text x="92" y="338" font-size="13" font-weight="600" fill="#334155">CHIRPS Rainfall</text>

    <use href="#icon-cloud" x="65" y="351" width="18" height="18"/>
    <text x="92" y="365" font-size="13" font-weight="600" fill="#1e3a8a">ERA5 Climate Data</text>

    <use href="#icon-cloud" x="65" y="378" width="18" height="18"/>
    <text x="92" y="392" font-size="13" font-weight="600" fill="#334155">ERA5-Land Hourly</text>

    <use href="#icon-building" x="65" y="405" width="18" height="18"/>
    <text x="92" y="419" font-size="13" font-weight="600" fill="#334155">Open Buildings</text>


    <!-- 2. PROCESSING & ANALYSIS -->
    <rect x="315" y="85" width="250" height="370" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <path d="M315 93 a8 8 0 0 1 8 -8 h234 a8 8 0 0 1 8 8 v32 h-250 z" fill="#15803d"/>
    <text x="440" y="110" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Processing &amp; Analysis</text>

    <!-- Processing Items (Slightly adjusted spacing to 31px to balance layout) -->
    <use href="#icon-api" x="330" y="135" width="18" height="18"/>
    <text x="358" y="149" font-size="13" font-weight="600" fill="#334155">Pygeoapi</text>

    <use href="#icon-code" x="330" y="166" width="18" height="18"/>
    <text x="358" y="180" font-size="13" font-weight="600" fill="#334155">Dask-GeoPandas</text>

    <use href="#icon-globe" x="330" y="197" width="18" height="18"/>
    <text x="358" y="211" font-size="13" font-weight="600" fill="#334155">GeoAI</text>

    <use href="#icon-code" x="330" y="228" width="18" height="18"/>
    <text x="358" y="242" font-size="13" font-weight="600" fill="#334155">TorchGeo</text>

    <use href="#icon-arrows" x="330" y="259" width="18" height="18"/>
    <text x="358" y="273" font-size="13" font-weight="600" fill="#701a75">Disaster Logic DAG</text>

    <use href="#icon-api" x="330" y="290" width="18" height="18"/>
    <text x="358" y="304" font-size="13" font-weight="600" fill="#334155">STAC API</text>

    <use href="#icon-db" x="330" y="321" width="18" height="18"/>
    <text x="358" y="335" font-size="13" font-weight="600" fill="#334155">PostGIS Database</text>

    <use href="#icon-globe" x="330" y="352" width="18" height="18"/>
    <text x="358" y="366" font-size="13" font-weight="600" fill="#334155">Google Earth Engine (GEE)</text>

    <!-- 3. INTELLIGENCE MODULES -->
    <rect x="590" y="85" width="270" height="260" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <path d="M590 93 a8 8 0 0 1 8 -8 h254 a8 8 0 0 1 8 8 v32 h-270 z" fill="#475569"/>
    <text x="725" y="110" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Intelligence Modules</text>

    <!-- Intelligence Items -->
    <use href="#icon-fire" x="605" y="145" width="18" height="18"/>
    <text x="633" y="159" font-size="13" font-weight="600" fill="#334155">Fire Detection</text>

    <use href="#icon-water" x="605" y="190" width="18" height="18"/>
    <text x="633" y="204" font-size="13" font-weight="600" fill="#334155">Flood Assessment</text>

    <use href="#icon-building" x="605" y="235" width="18" height="18"/>
    <text x="633" y="249" font-size="13" font-weight="600" fill="#334155">Exposure Modeling</text>

    <use href="#icon-disease" x="605" y="280" width="18" height="18"/>
    <text x="633" y="294" font-size="13" font-weight="600" fill="#334155">Vector Borne Disease Warning</text>

    <!-- 4. DECISION SUPPORT -->
    <rect x="885" y="85" width="265" height="260" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="8"/>
    <path d="M885 93 a8 8 0 0 1 8 -8 h249 a8 8 0 0 1 8 8 v32 h-265 z" fill="#b91c1c"/>
    <text x="1017" y="110" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Decision Support</text>

    <!-- Decision Support Items -->
    <use href="#icon-map" x="900" y="145" width="18" height="18"/>
    <text x="928" y="159" font-size="13" font-weight="600" fill="#334155">Risk Maps</text>

    <use href="#icon-dashboard" x="900" y="190" width="18" height="18"/>
    <text x="928" y="204" font-size="13" font-weight="600" fill="#334155">Real-Time Dashboards</text>

    <use href="#icon-alert" x="900" y="235" width="18" height="18"/>
    <text x="928" y="249" font-size="13" font-weight="600" fill="#334155">Alerts &amp; Reports</text>

    <use href="#icon-chat" x="900" y="280" width="18" height="18"/>
    <text x="928" y="294" font-size="13" font-weight="600" fill="#334155">Feedback Loop (Citizen &amp; Field)</text>

    <!-- Docker & Kubernetes Underpinning Block -->
    <rect x="590" y="365" width="560" height="90" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" rx="8"/>
    <use href="#icon-docker" x="610" y="395" width="30" height="30"/>
    <use href="#icon-k8s" x="650" y="395" width="30" height="30"/>
    <text x="700" y="416" font-size="15" font-weight="bold" fill="#1e40af">Docker &amp; Kubernetes Deployment Platform</text>
  </g>

  <!-- Connective Chevron Arrows -->
  <path d="M 294 260 L 302 265 L 294 270" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 572 210 L 580 215 L 572 220" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <path d="M 867 210 L 875 215 L 867 220" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

  <!-- Deployment upward markers (Dashed Blue Arrows) -->
  <path d="M 440 455 L 440 465 L 510 465" fill="none" stroke="#3b82f6" stroke-dasharray="3,3" stroke-width="1.5"/>
  <path d="M 725 365 L 725 352" fill="none" stroke="#3b82f6" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-head)"/>
  <path d="M 1017 365 L 1017 352" fill="none" stroke="#3b82f6" stroke-dasharray="3,3" stroke-width="1.5" marker-end="url(#arrow-head)"/>

  <!-- Workflow Summary Table Container -->
  <foreignObject x="50" y="480" width="1100" height="450">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; width: 100%; height: 100%;">
      <table style="width: 100%; border-collapse: collapse; background-color: #ffffff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1;">
        <thead>
          <tr style="background-color: #1e3a8a; color: #ffffff; text-align: left; font-size: 14px;">
            <th colspan="4" style="padding: 12px; text-align: center; font-weight: bold; font-size: 15px; border-bottom: 2px solid #1d4ed8; letter-spacing: 0.5px;">OpenDR 1.0 Workflow Summary</th>
          </tr>
          <tr style="background-color: #f1f5f9; font-weight: bold; border-bottom: 2px solid #cbd5e1; font-size: 12px;">
            <th style="padding: 10px; width: 18%; color: #1e40af; border-right: 1px solid #cbd5e1;">Stage</th>
            <th style="padding: 10px; width: 25%; color: #15803d; border-right: 1px solid #cbd5e1;">Description</th>
            <th style="padding: 10px; width: 42%; color: #b45309; border-right: 1px solid #cbd5e1;">Tools Used</th>
            <th style="padding: 10px; width: 15%; color: #b91c1c;">Output</th>
          </tr>
        </thead>
        <tbody>
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; font-weight: bold; color: #1e40af; background-color: #f8fafc; border-right: 1px solid #e2e8f0; vertical-align: middle;">Data Ingestion</td>
            <td style="padding: 10px; color: #334155; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Multi-sensor data acquisition</td>
            <td style="padding: 10px; color: #475569; font-size: 11px; font-family: monospace, Courier; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">FIRMS, Sentinel-1/2, ALOS-2, Landsat 8/9, GOES, GRACE, CHIRPS, ERA5 Climate Data, ERA5-Land, Open Buildings</td>
            <td style="padding: 10px; font-weight: bold; color: #475569; vertical-align: middle; line-height: 1.4; background-color: #f8fafc;">Raw Satellite Data</td>
          </tr>
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; font-weight: bold; color: #15803d; background-color: #f8fafc; border-right: 1px solid #e2e8f0; vertical-align: middle;">Preprocessing &amp; Analysis</td>
            <td style="padding: 10px; color: #334155; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Distributed geospatial processing</td>
            <td style="padding: 10px; color: #475569; font-size: 11px; font-family: monospace, Courier; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Pygeoapi, Dask-GeoPandas, GeoAI, TorchGeo, Disaster Logic DAG, STAC API, PostGIS Database, GEE</td>
            <td style="padding: 10px; font-weight: bold; color: #475569; vertical-align: middle; line-height: 1.4; background-color: #f8fafc;">Processed Imagery</td>
          </tr>
          <tr style="border-bottom: 1px solid #e2e8f0;">
            <td style="padding: 10px; font-weight: bold; color: #475569; background-color: #f8fafc; border-right: 1px solid #e2e8f0; vertical-align: middle;">Intelligence Modules</td>
            <td style="padding: 10px; color: #334155; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Fire, Flood, Exposure Risk Modeling, Vector Disease Early Warning</td>
            <td style="padding: 10px; color: #475569; font-size: 11px; font-family: monospace, Courier; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Fire Detection, Flood Assessment, Exposure Modeling, Vector Borne Disease Module</td>
            <td style="padding: 10px; font-weight: bold; color: #475569; vertical-align: middle; line-height: 1.4; background-color: #f8fafc;">Risk Assessments</td>
          </tr>
          <tr>
            <td style="padding: 10px; font-weight: bold; color: #b91c1c; background-color: #f8fafc; border-right: 1px solid #e2e8f0; vertical-align: middle;">Decision Support</td>
            <td style="padding: 10px; color: #334155; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Visualization, alerting, and participatory input</td>
            <td style="padding: 10px; color: #475569; font-size: 11px; font-family: monospace, Courier; border-right: 1px solid #cbd5e1; vertical-align: middle; line-height: 1.4;">Risk Maps, Dashboards, Alert Systems, Feedback Loop</td>
            <td style="padding: 10px; font-weight: bold; color: #475569; vertical-align: middle; line-height: 1.4; background-color: #f8fafc;">Actionable Insights</td>
          </tr>
        </tbody>
      </table>
    </div>
  </foreignObject>
</svg>
