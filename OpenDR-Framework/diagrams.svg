<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="350" fill="#ffffff" />
  
  <!-- Left Panel: Diffusion Process -->
  <g transform="translate(40, 40)">
    <!-- Title -->
    <text x="160" y="0" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="15" fill="#1e293b">1. Diffusion Process (No Jumps)</text>
    <!-- Axes -->
    <line x1="40" y1="240" x2="320" y2="240" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="240" stroke="#334155" stroke-width="2"/>
    <!-- Axis Labels -->
    <text x="180" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Time (t)</text>
    <text x="15" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" transform="rotate(-90 15,135)">Price S(t)</text>
    <!-- Grid -->
    <line x1="40" y1="80" x2="320" y2="80" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="40" y1="130" x2="320" y2="130" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="40" y1="180" x2="320" y2="180" stroke="#e2e8f0" stroke-dasharray="4"/>
    <!-- Continuous Diffusion Path -->
    <path d="M 40,160 L 50,155 L 60,162 L 70,145 L 80,148 L 90,135 L 100,140 L 110,125 L 120,130 L 130,118 L 140,122 L 150,105 L 160,112 L 170,98 L 180,104 L 190,88 L 200,95 L 210,78 L 220,85 L 230,70 L 240,75 L 250,62 L 260,68 L 270,55 L 280,60 L 290,48 L 300,52 L 310,42 L 320,45" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    <text x="180" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2563eb" font-style="italic">Continuous path (no gaps/breaks)</text>
  </g>

  <!-- Right Panel: Pure Jump Process -->
  <g transform="translate(440, 40)">
    <!-- Title -->
    <text x="160" y="0" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="15" fill="#1e293b">2. Pure Jump Process (No Diffusion)</text>
    <!-- Axes -->
    <line x1="40" y1="240" x2="320" y2="240" stroke="#334155" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="240" stroke="#334155" stroke-width="2"/>
    <!-- Axis Labels -->
    <text x="180" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569">Time (t)</text>
    <text x="15" y="135" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" transform="rotate(-90 15,135)">Price S(t)</text>
    <!-- Grid -->
    <line x1="40" y1="80" x2="320" y2="80" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="40" y1="130" x2="320" y2="130" stroke="#e2e8f0" stroke-dasharray="4"/>
    <line x1="40" y1="180" x2="320" y2="180" stroke="#e2e8f0" stroke-dasharray="4"/>
    <!-- Step Jump Path -->
    <path d="M 40,180 L 100,180 L 100,120 L 180,120 L 180,155 L 250,155 L 250,70 L 320,70" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <!-- Jump Points -->
    <circle cx="100" cy="120" r="4" fill="#dc2626"/>
    <circle cx="180" cy="155" r="4" fill="#dc2626"/>
    <circle cx="250" cy="70" r="4" fill="#dc2626"/>
    <text x="180" y="210" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#dc2626" font-style="italic">Piecewise flat + sudden vertical jumps</text>
  </g>
</svg>
