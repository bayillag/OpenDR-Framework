<svg width="900" height="1100" viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f9f9f9" />

  <!-- Title -->
  <text x="450" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a5276">Quantitative Scenario Tree: Entry &amp; Exposure Assessment</text>

  <!-- START -->
  <rect x="350" y="60" width="200" height="40" rx="5" fill="#3498db" />
  <text x="450" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Selected Export Livestock</text>
  <line x1="450" y1="100" x2="450" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- P1 -->
  <rect x="360" y="130" width="180" height="60" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="450" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">P1: Active Outbreak?</text>
  <text x="450" y="175" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Active in UAE?</text>
  <!-- P1 No -->
  <line x1="540" y1="160" x2="650" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="560" y="153" font-family="Arial, sans-serif" font-size="12" fill="red">No</text>
  <text x="660" y="165" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-weight="bold">[NO RISK]</text>
  <!-- P1 Yes -->
  <line x1="450" y1="190" x2="450" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="455" y="215" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Yes (30.48%)</text>

  <!-- P2 -->
  <rect x="360" y="230" width="180" height="60" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">P2: Host Infected?</text>
  <text x="450" y="275" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Subclinical/Incubating?</text>
  <!-- P2 No -->
  <line x1="540" y1="260" x2="650" y2="260" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="560" y="253" font-family="Arial, sans-serif" font-size="12" fill="red">No</text>
  <text x="660" y="265" font-family="Arial, sans-serif" font-size="12" fill="#7f8c8d" font-weight="bold">[NO RISK]</text>
  <!-- P2 Yes -->
  <line x1="450" y1="290" x2="450" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="455" y="315" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Yes (1.19%)</text>

  <!-- P3 -->
  <rect x="360" y="330" width="180" height="60" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="450" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">P3: Source Failure</text>
  <text x="450" y="375" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">UAE Exam Misses?</text>
  <!-- P3 No -->
  <line x1="540" y1="360" x2="650" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="560" y="353" font-family="Arial, sans-serif" font-size="12" fill="red">No</text>
  <rect x="655" y="345" width="160" height="30" fill="#f39c12" rx="3" />
  <text x="735" y="365" font-family="Arial, sans-serif" font-size="11" fill="white" font-weight="bold" text-anchor="middle">[STOPPED IN UAE]</text>
  <!-- P3 Yes -->
  <line x1="450" y1="390" x2="450" y2="430" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="455" y="415" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Yes (3.00%)</text>

  <!-- DEPARTURE -->
  <rect x="325" y="430" width="250" height="40" rx="20" fill="#e74c3c" />
  <text x="450" y="455" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">INFECTED HOST DEPARTS UAE</text>

  <!-- Split Pathway -->
  <line x1="450" y1="470" x2="450" y2="500" stroke="#333" stroke-width="2" />
  <line x1="200" y1="500" x2="700" y2="500" stroke="#333" stroke-width="2" />
  <line x1="200" y1="500" x2="200" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="700" y1="500" x2="700" y2="530" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <text x="200" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2980b9">AIR PATHWAY (BOLE)</text>
  <text x="700" y="495" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#d35400">MARITIME PATHWAY (DJIBOUTI)</text>

  <!-- COLUMN 1: AIR -->
  <!-- P4 Air -->
  <rect x="110" y="530" width="180" height="50" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="200" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P4: Transit Survival?</text>
  <line x1="290" y1="555" x2="350" y2="555" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="355" y="558" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">[DEAD]</text>
  <line x1="200" y1="580" x2="200" y2="620" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="205" y="605" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Yes (99.9%)</text>
  <!-- P5 Air -->
  <rect x="110" y="620" width="180" height="50" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="200" y="640" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P5: Dest. Det. Fail?</text>
  <line x1="290" y1="645" x2="350" y2="645" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="355" y="648" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">[STOPPED]</text>
  <line x1="200" y1="670" x2="200" y2="710" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="205" y="695" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Yes (10.0%)</text>
  <!-- P6 Air -->
  <rect x="110" y="710" width="180" height="50" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="200" y="730" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P6: Contact Estab?</text>
  <line x1="290" y1="735" x2="350" y2="735" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="355" y="738" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">[NO ESTAB]</text>
  <line x1="200" y1="760" x2="200" y2="800" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="205" y="785" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Yes (40.0%)</text>

  <!-- COLUMN 2: MARITIME -->
  <!-- P4 Sea -->
  <rect x="610" y="530" width="180" height="50" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="700" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P4: Transit Survival?</text>
  <line x1="790" y1="555" x2="850" y2="555" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="855" y="558" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">[DEAD]</text>
  <line x1="700" y1="580" x2="700" y2="620" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="705" y="605" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Yes (98.5%)</text>
  <!-- P5 Sea -->
  <rect x="610" y="620" width="180" height="50" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="700" y="640" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P5: Dest. Det. Fail?</text>
  <line x1="790" y1="645" x2="850" y2="645" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="855" y="648" font-family="Arial, sans-serif" font-size="11" fill="#f39c12">[STOPPED]</text>
  <line x1="700" y1="670" x2="700" y2="710" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="705" y="695" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Yes (15.0%)</text>
  <!-- P6 Sea -->
  <rect x="610" y="710" width="180" height="50" rx="2" fill="white" stroke="#333" stroke-width="2" />
  <text x="700" y="730" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">P6: Contact Estab?</text>
  <line x1="790" y1="735" x2="850" y2="735" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)" />
  <text x="855" y="738" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">[NO ESTAB]</text>
  <line x1="700" y1="760" x2="700" y2="800" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <text x="705" y="785" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Yes (65.0%)</text>

  <!-- END OUTCOMES -->
  <rect x="50" y="800" width="300" height="50" rx="5" fill="#c0392b" />
  <text x="200" y="820" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">EXPOSURE OF ETHIOPIAN HERDS</text>
  <text x="200" y="840" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Via Air Pathway</text>

  <rect x="550" y="800" width="300" height="50" rx="5" fill="#c0392b" />
  <text x="700" y="820" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">EXPOSURE OF ETHIOPIAN HERDS</text>
  <text x="700" y="840" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Via Maritime Pathway</text>

</svg>
