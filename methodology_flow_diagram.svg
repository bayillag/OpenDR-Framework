<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e8f0" />
    </pattern>

    <!-- Card Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>

    <!-- Gradient for Left Modules -->
    <linearGradient id="moduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="#f8fafc" />
  <rect width="900" height="650" fill="url(#dotGrid)" />

  <!-- METHODOLOGY FLOW Container -->
  <rect x="300" y="75" width="540" height="510" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#subtleShadow)" />
  
  <!-- Container Header Badge -->
  <rect x="470" y="60" width="200" height="30" rx="15" fill="#0f172a" />
  <text x="570" y="79" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">METHODOLOGY FLOW</text>

  <!-- Central Conduit / Bus Line (Representing the ASCII '│') -->
  <line x1="330" y1="95" x2="330" y2="565" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" />

  <!-- ROW 1 -->
  <g id="row1">
    <!-- Left Module -->
    <rect x="60" y="110" width="190" height="54" rx="8" fill="url(#moduleGrad)" filter="url(#subtleShadow)" />
    <text x="76" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">MODULE 1</text>
    <text x="76" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Ingestion</text>

    <!-- Connector -->
    <path d="M 250 137 L 352 137" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Intersection Node (ASCII '┼') -->
    <circle cx="330" cy="137" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Process Card -->
    <rect x="360" y="110" width="450" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
    <rect x="360" y="110" width="4" height="54" rx="2" fill="#6366f1" />
    <text x="378" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Environmental Data Processing &amp; Feature Engineering</text>
  </g>

  <!-- ROW 2 -->
  <g id="row2">
    <!-- Left Module -->
    <rect x="60" y="185" width="190" height="54" rx="8" fill="url(#moduleGrad)" filter="url(#subtleShadow)" />
    <text x="76" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">MODULE 2</text>
    <text x="76" y="221" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">ML Engine</text>

    <!-- Connector -->
    <path d="M 250 212 L 352 212" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Intersection Node -->
    <circle cx="330" cy="212" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Process Card -->
    <rect x="360" y="185" width="450" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
    <rect x="360" y="185" width="4" height="54" rx="2" fill="#0d9488" />
    <text x="378" y="217" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Supervised Ensemble Outbreak Projections (Month T+2)</text>
  </g>

  <!-- ROW 3 -->
  <g id="row3">
    <!-- Left Module -->
    <rect x="60" y="260" width="190" height="54" rx="8" fill="url(#moduleGrad)" filter="url(#subtleShadow)" />
    <text x="76" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">MODULE 3</text>
    <text x="76" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">ODE Solver</text>

    <!-- Connector -->
    <path d="M 250 287 L 352 287" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Intersection Node -->
    <circle cx="330" cy="287" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Process Card -->
    <rect x="360" y="260" width="450" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
    <rect x="360" y="260" width="4" height="54" rx="2" fill="#6366f1" />
    <text x="378" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Mechanistic Simulations, Stability &amp; Optimal Control</text>
  </g>

  <!-- ROW 4 -->
  <g id="row4">
    <!-- Left Module -->
    <rect x="60" y="335" width="190" height="54" rx="8" fill="url(#moduleGrad)" filter="url(#subtleShadow)" />
    <text x="76" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">MODULE 4</text>
    <text x="76" y="371" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">QRA Engine</text>

    <!-- Connector -->
    <path d="M 250 362 L 352 362" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Intersection Node -->
    <circle cx="330" cy="362" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Process Card -->
    <rect x="360" y="335" width="450" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
    <rect x="360" y="335" width="4" height="54" rx="2" fill="#0d9488" />
    <text x="378" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Stochastic Cross-Border Introduction Trees (10k Iterations)</text>
  </g>

  <!-- ROW 5 -->
  <g id="row5">
    <!-- Left Module -->
    <rect x="60" y="410" width="190" height="54" rx="8" fill="url(#moduleGrad)" filter="url(#subtleShadow)" />
    <text x="76" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">MODULE 5</text>
    <text x="76" y="446" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Sampling</text>

    <!-- Connector -->
    <path d="M 250 437 L 352 437" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Intersection Node -->
    <circle cx="330" cy="437" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Process Card -->
    <rect x="360" y="410" width="450" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
    <rect x="360" y="410" width="4" height="54" rx="2" fill="#6366f1" />
    <text x="378" y="442" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Two-Stage Stratified Surveillance Allocation Plans</text>
  </g>

  <!-- ROW 6 -->
  <g id="row6">
    <!-- Left Module -->
    <rect x="60" y="485" width="190" height="54" rx="8" fill="url(#moduleGrad)" filter="url(#subtleShadow)" />
    <text x="76" y="505" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="1">MODULE 6</text>
    <text x="76" y="521" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Portal</text>

    <!-- Connector -->
    <path d="M 250 512 L 352 512" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- Intersection Node -->
    <circle cx="330" cy="512" r="4" fill="#0d9488" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Process Card -->
    <rect x="360" y="485" width="450" height="54" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#subtleShadow)" />
    <rect x="360" y="485" width="4" height="54" rx="2" fill="#0d9488" />
    <text x="378" y="517" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#1e293b">Interactive Web-Based Decision-Support Platform</text>
  </g>
</svg>
